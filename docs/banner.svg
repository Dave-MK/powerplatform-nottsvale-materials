<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Nottsvale Materials: Power Platform maintenance system" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160a24"/>
      <stop offset="0.55" stop-color="#3b1450"/>
      <stop offset="1" stop-color="#742774"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>

    <!-- floor plan grid, echoing the Floorplan app -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
      <path d="M700 0V340M780 0V340M860 0V340M940 0V340M1020 0V340M1100 0V340M1180 0V340M1260 0V340"/>
      <path d="M620 40H1280M620 100H1280M620 160H1280M620 220H1280M620 280H1280"/>
    </g>
    <!-- plan outline -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
      <rect x="720" y="52" width="500" height="236" rx="6"/>
      <path d="M720 130H900V288"/>
      <path d="M900 130H1060V52"/>
      <path d="M1060 200H1220"/>
    </g>
    <!-- process flow line -->
    <path d="M745 92H1190" stroke="#ffd166" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="10 9" fill="none"/>
    <!-- assets -->
    <g>
      <circle cx="770" cy="92" r="9" fill="#ff9d4d"/>
      <circle cx="850" cy="92" r="9" fill="#ff9d4d"/>
      <circle cx="960" cy="92" r="9" fill="#ff9d4d"/>
      <circle cx="1090" cy="92" r="9" fill="#ff9d4d"/>
      <circle cx="1170" cy="92" r="9" fill="#ff9d4d"/>
      <circle cx="800" cy="200" r="9" fill="#4fd1c5"/>
      <circle cx="960" cy="240" r="9" fill="#4fd1c5"/>
      <circle cx="1130" cy="250" r="9" fill="#4fd1c5"/>
      <circle cx="1000" cy="170" r="9" fill="#ff9d4d"/>
      <!-- highlighted asset -->
      <circle cx="960" cy="92" r="20" fill="none" stroke="#ff9d4d" stroke-opacity="0.6" stroke-width="2"/>
    </g>

    <!-- text -->
    <text x="64" y="112" fill="#ffd166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">POWER PLATFORM PORTFOLIO BUILD</text>
    <text x="64" y="178" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1">Nottsvale Materials</text>
    <rect x="64" y="196" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="240" fill="#e9dff0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21">Maintenance system: from an empty tenant to working apps</text>

    <!-- pills -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">
      <rect x="64" y="272" width="100" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
      <text x="114" y="293" text-anchor="middle">Dataverse</text>
      <rect x="174" y="272" width="112" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
      <text x="230" y="293" text-anchor="middle">Canvas app</text>
      <rect x="296" y="272" width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
      <text x="370" y="293" text-anchor="middle">Model-driven app</text>
      <rect x="454" y="272" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
      <text x="506" y="293" text-anchor="middle">Code app</text>
      <rect x="568" y="272" width="100" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
      <text x="618" y="293" text-anchor="middle">Power BI</text>
    </g>
  </g>
</svg>
